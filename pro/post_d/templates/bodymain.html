{% extends "base.html" %}
{% block start %}

<style>
    .post {
        background-color: #fff;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
    }

    .post:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    .post-author {
        font-size: 18px;
        color: #333;
        margin-bottom: 10px;
    }

    .post-date {
        font-size: 14px;
        color: #999;
    }

    .post-image img {
        margin-top: 15px;
        border-radius: 12px;
        width: 100%;
        height: auto;
        object-fit: cover;
    }

    p {
        text-align: center;
        font-size: 20px;
        color: #666;
        margin-top: 30px;
    }
</style>

<div class="row">
    <div class="col-md-8 offset-md-2">
        {% for post in posts %}
            <div class="post mb-4">
                <div class="post-author">
                    <strong>{{ post.user.username }}</strong>
                    <span class="post-date float-right">{{ post.created_at|date:"M d, Y H:i" }}</span>
                </div>
                <hr>
                {% if post.image %}
                    <div class="post-image">
                        <img src="{{ post.image.url }}" alt="Post Image" class="img-fluid rounded">
                    </div>
                {% endif %}
            </div>
        {% empty %}
            <p>No posts yet.</p>
        {% endfor %}
    </div>
</div>

{% endblock %}
