{% extends "base.html" %}

{% block start %}
{% load static %}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{% static '/style.css' %}">

<div class="container">
    <h2 class="mt-4 mb-3">Upload a New Post</h2>
    <form method="post" enctype="multipart/form-data" action="{% url 'upload_post' %}">
        {% csrf_token %}

        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="image_post">Select Image:</label>
                    <input type="file" class="form-control-file" id="image_post" name="image_post" required>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Upload Post</button>
    </form>
</div>

{% endblock %}
